# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser v2 configuration
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: goproxy
    main: ./cmd/goproxy
    binary: goproxy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X paepcke.de/goproxy/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - freebsd
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: goproxy
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md

nfpms:
  - id: goproxy
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Michael Paepcke
    homepage: https://github.com/paepckehh/goproxy
    maintainer: Michael Paepcke <git@paepcke.de>
    description: |-
      Single-binary caching Go module proxy: fast upstream caching,
      sum.golang.org signature verification, embedded operations
      dashboard with long-term SQLite statistics. Pure Go, statically
      linked, no cgo.
    license: BSD-3-Clause
    formats:
      - deb
      - rpm
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/goproxy/LICENSE
        file_info:
          mode: 0644
      - src: ./README.md
        dst: /usr/share/doc/goproxy/README.md
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
