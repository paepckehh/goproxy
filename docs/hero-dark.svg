<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">goproxy - a local-first, checksum-verifying Go module archive</title>
  <desc id="desc">Dark banner with the goproxy wordmark and an illustrated operations dashboard: hit ratio, archive size, peer health, a 3D bandwidth chart and the most requested modules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0a1122"/>
      <stop offset="1" stop-color="#0e1730"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="barSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
    <filter id="glowBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <clipPath id="cardClip">
      <rect width="610" height="292" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <ellipse cx="300" cy="70" rx="330" ry="220" fill="url(#glowA)"/>
  <ellipse cx="1060" cy="330" rx="300" ry="210" fill="url(#glowB)"/>
  <rect y="0.5" width="1200" height="379" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <g>
    <rect x="64" y="58" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="80" cy="71" r="3.5" fill="#34d399"/>
    <text x="92" y="75" font-size="9.5" font-weight="700" letter-spacing="2.1" fill="#a5b4fc">LOCAL-FIRST GO MODULE ARCHIVE</text>

    <text x="62" y="154" font-size="76" font-weight="800" letter-spacing="-3.2" fill="#eef3ff"><tspan fill="#818cf8">go</tspan>proxy</text>

    <text x="64" y="196" font-size="17" fill="#93a4c4">Fast, checksum-verified Go modules,</text>
    <text x="64" y="220" font-size="17" fill="#93a4c4">archived on your disk, forever.</text>

    <g font-size="11" font-weight="600">
      <rect x="64" y="246" width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.13"/>
      <text x="123" y="265" text-anchor="middle" fill="#dbe4f8">single binary</text>
      <rect x="192" y="246" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.13"/>
      <text x="240" y="265" text-anchor="middle" fill="#dbe4f8">cgo-free</text>
      <rect x="298" y="246" width="140" height="30" rx="15" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.28"/>
      <text x="368" y="265" text-anchor="middle" fill="#67e8f9">sumdb verified</text>
    </g>

    <text x="64" y="312" font-size="12" fill="#63769c" letter-spacing="0.3">
      <tspan fill="#818cf8">github.com/paepckehh/goproxy</tspan>
      <tspan dx="10" fill="#42506e">/</tspan>
      <tspan dx="10" fill="#63769c">one binary. zero cloud.</tspan>
    </text>
  </g>

  <ellipse cx="860" cy="352" rx="300" ry="20" fill="#020617" fill-opacity="0.55"/>

  <g transform="translate(540 48)" filter="url(#cardShadow)">
    <rect width="610" height="292" rx="18" fill="#0f1729" stroke="#ffffff" stroke-opacity="0.10"/>
    <g clip-path="url(#cardClip)">
      <rect width="610" height="292" fill="#0f1729"/>
      <rect width="610" height="34" fill="#0b1222"/>
      <path d="M0 34.5H610" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="20" cy="17" r="3.5" fill="#f87171"/>
      <circle cx="32" cy="17" r="3.5" fill="#fbbf24"/>
      <circle cx="44" cy="17" r="3.5" fill="#34d399"/>
      <rect x="70" y="8" width="214" height="18" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.07"/>
      <text x="82" y="20.5" font-size="8.5" fill="#8ea2c4" letter-spacing="0.2">localhost:5100</text>
      <circle cx="570" cy="17" r="3" fill="#34d399"/>
      <text x="580" y="20.5" font-size="8.5" fill="#63769c">live</text>

      <g>
        <rect x="18" y="48" width="182" height="54" rx="10" fill="#0b1222" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="32" y="67" font-size="8.5" letter-spacing="1.1" fill="#63769c">HIT RATIO</text>
        <text x="32" y="93" font-size="21" font-weight="700" fill="#34d399">99.2%</text>

        <rect x="214" y="48" width="182" height="54" rx="10" fill="#0b1222" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="228" y="67" font-size="8.5" letter-spacing="1.1" fill="#63769c">ARCHIVE SIZE</text>
        <text x="228" y="93" font-size="21" font-weight="700" fill="#eef3ff">41.8 <tspan font-size="12" font-weight="600" fill="#93a4c4">GB</tspan></text>

        <rect x="410" y="48" width="182" height="54" rx="10" fill="#0b1222" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="424" y="67" font-size="8.5" letter-spacing="1.1" fill="#63769c">PEERS ONLINE</text>
        <text x="424" y="93" font-size="21" font-weight="700" fill="#eef3ff">2 <tspan fill="#63769c">/</tspan> 2</text>
        <circle cx="570" cy="87" r="4" fill="#34d399"/>
      </g>

      <g>
        <rect x="18" y="116" width="370" height="158" rx="12" fill="#0b1222" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="32" y="138" font-size="8.5" letter-spacing="1.2" fill="#63769c">BANDWIDTH SERVED</text>
        <text x="374" y="138" text-anchor="end" font-size="8.5" fill="#42506e">30d</text>

        <g stroke="#ffffff" stroke-opacity="0.06" stroke-dasharray="3 5">
          <path d="M32 252H374"/>
          <path d="M32 216H374"/>
          <path d="M32 180H374"/>
          <path d="M32 144H374"/>
        </g>

        <g>
          <polygon points="48,208 55,201 81,201 74,208" fill="#a5b4fc"/>
          <polygon points="74,208 81,201 81,245 74,252" fill="url(#barSide)"/>
          <rect x="48" y="208" width="26" height="44" fill="url(#bar)"/>

          <polygon points="94,182 101,175 127,175 120,182" fill="#a5b4fc"/>
          <polygon points="120,182 127,175 127,245 120,252" fill="url(#barSide)"/>
          <rect x="94" y="182" width="26" height="70" fill="url(#bar)"/>

          <polygon points="140,194 147,187 173,187 166,194" fill="#a5b4fc"/>
          <polygon points="166,194 173,187 173,245 166,252" fill="url(#barSide)"/>
          <rect x="140" y="194" width="26" height="58" fill="url(#bar)"/>

          <polygon points="186,156 193,149 219,149 212,156" fill="#a5b4fc"/>
          <polygon points="212,156 219,149 219,245 212,252" fill="url(#barSide)"/>
          <rect x="186" y="156" width="26" height="96" fill="url(#bar)"/>

          <polygon points="232,174 239,167 265,167 258,174" fill="#a5b4fc"/>
          <polygon points="258,174 265,167 265,245 258,252" fill="url(#barSide)"/>
          <rect x="232" y="174" width="26" height="78" fill="url(#bar)"/>

          <polygon points="278,132 285,125 311,125 304,132" fill="#a5b4fc"/>
          <polygon points="304,132 311,125 311,245 304,252" fill="url(#barSide)"/>
          <rect x="278" y="132" width="26" height="120" fill="url(#bar)"/>

          <polygon points="324,160 331,153 357,153 350,160" fill="#a5b4fc"/>
          <polygon points="350,160 357,153 357,245 350,252" fill="url(#barSide)"/>
          <rect x="324" y="160" width="26" height="92" fill="url(#bar)"/>
        </g>

        <g font-size="7.5" fill="#42506e" text-anchor="middle">
          <text x="61" y="266">x/mod</text>
          <text x="107" y="266">net</text>
          <text x="153" y="266">sys</text>
          <text x="199" y="266">crypto</text>
          <text x="245" y="266">pkg</text>
          <text x="291" y="266">io</text>
          <text x="337" y="266">tool</text>
        </g>
      </g>

      <g>
        <rect x="400" y="116" width="192" height="158" rx="12" fill="#0b1222" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="414" y="138" font-size="8.5" letter-spacing="1.2" fill="#63769c">TOP MODULES</text>

        <text x="414" y="160" font-size="8.5" fill="#dbe4f8">golang.org/x/mod</text>
        <text x="578" y="160" text-anchor="end" font-size="8" fill="#93a4c4">8.4 GB</text>
        <rect x="414" y="166" width="164" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.06"/>
        <rect x="414" y="166" width="156" height="3" rx="1.5" fill="url(#bar)"/>

        <text x="414" y="188" font-size="8.5" fill="#dbe4f8">spf13/cobra</text>
        <text x="578" y="188" text-anchor="end" font-size="8" fill="#93a4c4">6.1 GB</text>
        <rect x="414" y="194" width="164" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.06"/>
        <rect x="414" y="194" width="118" height="3" rx="1.5" fill="url(#bar)"/>

        <text x="414" y="216" font-size="8.5" fill="#dbe4f8">modernc.org/sqlite</text>
        <text x="578" y="216" text-anchor="end" font-size="8" fill="#93a4c4">4.7 GB</text>
        <rect x="414" y="222" width="164" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.06"/>
        <rect x="414" y="222" width="91" height="3" rx="1.5" fill="url(#bar)"/>

        <text x="414" y="244" font-size="8.5" fill="#dbe4f8">golang.org/x/crypto</text>
        <text x="578" y="244" text-anchor="end" font-size="8" fill="#93a4c4">3.2 GB</text>
        <rect x="414" y="250" width="164" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.06"/>
        <rect x="414" y="250" width="62" height="3" rx="1.5" fill="url(#bar)"/>
      </g>

      <rect y="279" width="610" height="13" fill="url(#fade)"/>
    </g>
  </g>
</svg>
